name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16.15-alpine3.24
        env:
          POSTGRES_USER: ecommerce_test
          POSTGRES_PASSWORD: ci-postgres-disposable-only
          POSTGRES_DB: thanh_v2_test_server
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U ecommerce_test -d thanh_v2_test_server"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and verification tools
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.lock
          python -m pip install --disable-pip-version-check --no-build-isolation --no-deps -e .

      - name: Lint
        run: ruff check app tests migrations scripts

      - name: Check formatting
        run: ruff format --check app tests migrations scripts

      - name: Type-check
        run: mypy app

      - name: Run tests including PostgreSQL integration
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://ecommerce_test:ci-postgres-disposable-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/thanh_v2_test_server
        run: pytest --ignore=tests/test_agent_integration.py -q

      - name: Re-score legacy captured real-model baseline
        run: |
          python scripts/score_real_baseline.py
          git diff --exit-code -- evaluation/results/baseline-single-agent-v1

      - name: Re-score legacy captured real Multi-Agent artifact
        run: |
          python scripts/run_real_multi_agent_benchmark.py --score-only
          git diff --exit-code -- evaluation/results/real-multi-agent-v1

      - name: Build Python wheel
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .

      - name: Verify wheel frontend contents
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "app/shared/pricing-manifest.json" in names
          prefix = "app/frontend/dist/"
          assert prefix + "index.html" in names
          assert prefix + "favicon.svg" in names
          assert any(name.startswith(prefix + "assets/") and name.endswith(".js") for name in names)
          assert any(name.startswith(prefix + "assets/") and name.endswith(".css") for name in names)
          assert any(name.startswith(prefix + "assets/") and name.endswith(".woff2") for name in names)
          print(f"WHEEL_FRONTEND_STATUS=PASS file={wheel.name}")
          PY
