name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and verification tools
        run: python -m pip install --disable-pip-version-check ".[dev]"

      - name: Lint
        run: ruff check app tests migrations

      - name: Check formatting
        run: ruff format --check app tests migrations

      - name: Type-check
        run: mypy app

      - name: Run offline test suite
        run: pytest -m "not integration" -q

      - name: Build Python wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Validate Compose model
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          GATEWAY_API_KEYS: ci:ci-gateway-secret-123456
          OPERATIONS_API_KEY: ci-operations-secret-123456
          QDRANT_API_KEY: ci-qdrant-secret-123456
        run: docker compose -f compose.yaml config --quiet

      - name: Build hardened application image
        run: docker build --tag ecommerce-multi-agent:ci .
