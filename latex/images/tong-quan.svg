<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tong-quan-title tong-quan-desc" id="tong-quan-root"><title id="tong-quan-title">Từ câu hỏi đến câu trả lời có căn cứ</title><desc id="tong-quan-desc">Hệ thống chia công việc cho nhóm chuyên trách, lấy thông tin phù hợp và kiểm tra trước khi trả lời.</desc><defs>
      <style>#tong-quan-root { font-family: Arial,sans-serif; color: #111; }
      #tong-quan-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#tong-quan-root .diagram-container { overflow-x:visible }
}</style><marker id="tong-quan-arrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7 Z" fill="#404040"/></marker></defs><rect width="1280" height="720" fill="white"/><text x="40" y="680" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#111111">Thông tin chưa đủ thì cần nói rõ hoặc hỏi thêm, không tự bổ sung cho có vẻ đầy đủ.</text><path d="M360,148 H480" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M800,148 H920" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M1080,208 V296" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M920,356 H800" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M480,356 H360" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M640,504 V416" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><path d="M200,416 V504" fill="none" stroke="#404040" stroke-width="2" marker-end="url(#tong-quan-arrow)"/><g data-node-id="Người dùng"><rect x="40" y="88" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="60" y="116" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">YÊU CẦU</text>
    <text x="60" y="150" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Người dùng</text>
    <text x="60" y="182" font-family="Arial,sans-serif" font-size="21" fill="#404040">Hỏi bằng tiếng Việt</text></g><g data-node-id="Bộ điều phối"><rect x="480" y="88" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="3"/>
    <text x="500" y="116" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">TỔ CHỨC</text>
    <text x="500" y="150" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Bộ điều phối</text>
    <text x="500" y="182" font-family="Arial,sans-serif" font-size="21" fill="#404040">Hiểu và chia nhiệm vụ</text></g><g data-node-id="Nhóm chuyên gia"><rect x="920" y="88" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="940" y="116" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">CHUYÊN TRÁCH</text>
    <text x="940" y="150" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Nhóm chuyên gia</text>
    <text x="940" y="182" font-family="Arial,sans-serif" font-size="21" fill="#404040">Sách, đánh giá, kiến thức</text></g><g data-node-id="Kết quả từng phần"><rect x="920" y="296" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="940" y="324" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">PHỐI HỢP</text>
    <text x="940" y="358" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Kết quả từng phần</text>
    <text x="940" y="390" font-family="Arial,sans-serif" font-size="21" fill="#404040">Gắn đúng cuốn sách</text></g><g data-node-id="Bằng chứng"><rect x="480" y="296" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="500" y="324" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">CĂN CỨ</text>
    <text x="500" y="358" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Bằng chứng</text>
    <text x="500" y="390" font-family="Arial,sans-serif" font-size="21" fill="#404040">Thông tin có nguồn</text></g><g data-node-id="Kiểm tra, tổng hợp"><rect x="40" y="296" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="3"/>
    <text x="60" y="324" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">RÀ SOÁT</text>
    <text x="60" y="358" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Kiểm tra, tổng hợp</text>
    <text x="60" y="390" font-family="Arial,sans-serif" font-size="21" fill="#404040">Giữ ý đúng, nêu giới hạn</text></g><g data-node-id="Kho thông tin"><rect x="480" y="504" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="500" y="532" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">DỮ LIỆU</text>
    <text x="500" y="566" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Kho thông tin</text>
    <text x="500" y="598" font-family="Arial,sans-serif" font-size="21" fill="#404040">Dữ liệu đã được chọn lọc</text></g><g data-node-id="Câu trả lời"><rect x="40" y="504" width="320" height="120" rx="6" fill="white" stroke="#111111" stroke-width="1.6"/>
    <text x="60" y="532" font-family="Arial,sans-serif" font-size="17" fill="#4a4a4a">KẾT QUẢ</text>
    <text x="60" y="566" font-family="Arial,sans-serif" font-size="26" font-weight="600" fill="#111111">Câu trả lời</text>
    <text x="60" y="598" font-family="Arial,sans-serif" font-size="21" fill="#404040">Trả lời hoặc hỏi lại</text></g></svg>
