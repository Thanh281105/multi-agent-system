[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnamese-ecommerce-agent"
version = "1.0.0"
description = "Evidence Atlas multi-agent platform for historical Tiki Books data"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "fastapi>=0.115,<1",
    "openai>=1.66,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "redis>=6,<9",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
ecommerce-migrate = "app.db.migrate:main"
ecommerce-reset-legacy-seed = "app.db.reset_legacy_seed:main"
ecommerce-seed = "app.db.seed:main"
ecommerce-evaluate = "app.evaluation.runner:main"
ecommerce-evaluate-v2 = "app.evaluation.v2_runner:main"
ecommerce-evaluate-v3 = "app.evaluation.v3_cli:main"
ecommerce-data = "app.data.cli:main"

[project.optional-dependencies]
dev = [
    "fakeredis>=2.30,<3",
    "httpx>=0.27,<1",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.shared" = ["pricing-manifest.json"]
"app.frontend" = [
    "dist/index.html",
    "dist/assets/*",
    "dist/*.svg",
    "dist/*.ico",
    "dist/*.webmanifest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires OPENAI_API_KEY and a reachable OpenAI API",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
exclude = '(^|/)(tests|\.venv)/'
