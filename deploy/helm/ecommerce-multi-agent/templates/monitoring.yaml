{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "ecommerce-multi-agent.fullname" . }}
  labels:
    {{- include "ecommerce-multi-agent.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "ecommerce-multi-agent.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ include "ecommerce-multi-agent.secretName" . }}
          key: {{ .Values.secretKeys.operationsApiKey }}
{{- end }}
{{- if .Values.monitoring.prometheusRule.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "ecommerce-multi-agent.fullname" . }}
  labels:
    {{- include "ecommerce-multi-agent.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: {{ include "ecommerce-multi-agent.fullname" . }}.availability
      rules:
        - alert: EcommerceMultiAgentTargetDown
          expr: up{job="{{ include "ecommerce-multi-agent.fullname" . }}"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Multi-agent gateway scrape target is down
            description: Prometheus has been unable to scrape the gateway for five minutes.
        - alert: EcommerceMultiAgentDependencyUnready
          expr: sum(rate(dependency_readiness_checks_total{job="{{ include "ecommerce-multi-agent.fullname" . }}",outcome="failed"}[5m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A gateway dependency is repeatedly unready
            description: Database, Redis, or Qdrant readiness checks have failed during the last five minutes.
        - alert: EcommerceMultiAgentHighErrorRate
          expr: sum(rate(http_requests_total{job="{{ include "ecommerce-multi-agent.fullname" . }}",status_class="5xx"}[5m])) / clamp_min(sum(rate(http_requests_total{job="{{ include "ecommerce-multi-agent.fullname" . }}"}[5m])), 1) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Gateway 5xx rate exceeds five percent
            description: More than five percent of observed HTTP requests have failed for ten minutes.
        - alert: EcommerceMultiAgentHighP95Latency
          expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="{{ include "ecommerce-multi-agent.fullname" . }}"}[5m]))) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Gateway p95 latency exceeds five seconds
            description: End-to-end HTTP p95 latency has exceeded five seconds for ten minutes.
{{- end }}
{{- if .Values.monitoring.grafanaDashboard.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce-multi-agent.fullname" . }}-dashboard
  labels:
    {{- include "ecommerce-multi-agent.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  ecommerce-multi-agent.json: |-
{{ .Files.Get "files/ecommerce-multi-agent-dashboard.json" | indent 4 }}
{{- end }}
