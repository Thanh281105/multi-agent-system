apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecommerce-multi-agent.fullname" . }}
  labels:
    {{- include "ecommerce-multi-agent.labels" . | nindent 4 }}
data:
  APP_ENV: production
  SHARED_STATE_BACKEND: redis
  KNOWLEDGE_BACKEND: qdrant
  LEGACY_CHAT_ENABLED: "false"
  QDRANT_URL: {{ required "config.qdrantUrl is required" .Values.config.qdrantUrl | quote }}
  QDRANT_COLLECTION: {{ .Values.config.qdrantCollection | quote }}
  MODEL_RUNTIME_MODE: {{ .Values.config.modelRuntimeMode | quote }}
  EMBEDDING_BACKEND: {{ .Values.config.embeddingBackend | quote }}
  GATEWAY_PRINCIPAL_POLICIES: {{ .Values.config.gatewayPrincipalPolicies | quote }}
  REDIS_KEY_PREFIX: {{ .Values.config.redisKeyPrefix | quote }}
  SESSION_TTL_SECONDS: {{ .Values.config.sessionTtlSeconds | quote }}
  GATEWAY_RATE_LIMIT_REQUESTS: {{ .Values.config.gatewayRateLimitRequests | quote }}
  GATEWAY_RATE_LIMIT_WINDOW_SECONDS: {{ .Values.config.gatewayRateLimitWindowSeconds | quote }}
  GATEWAY_AUTH_ATTEMPT_REQUESTS: {{ .Values.config.gatewayAuthAttemptRequests | quote }}
  REDIS_SOCKET_TIMEOUT_SECONDS: {{ .Values.config.redisSocketTimeoutSeconds | quote }}
  QDRANT_TIMEOUT_SECONDS: {{ .Values.config.qdrantTimeoutSeconds | quote }}
  ORCHESTRATION_TIMEOUT_SECONDS: {{ .Values.config.orchestrationTimeoutSeconds | quote }}
  OPENAI_ROUTING_MODEL: {{ .Values.config.openaiRoutingModel | quote }}
  OPENAI_PLANNING_MODEL: {{ .Values.config.openaiPlanningModel | quote }}
  OPENAI_SPECIALIST_MODEL: {{ .Values.config.openaiSpecialistModel | quote }}
  OPENAI_SYNTHESIS_MODEL: {{ .Values.config.openaiSynthesisModel | quote }}
  OPENAI_REASONING_EFFORT: {{ .Values.config.openaiReasoningEffort | quote }}
  OPENAI_REQUEST_TIMEOUT_SECONDS: {{ .Values.config.openaiRequestTimeoutSeconds | quote }}
  OPENAI_MAX_RETRIES: {{ .Values.config.openaiMaxRetries | quote }}
  OPENAI_MAX_OUTPUT_TOKENS: {{ .Values.config.openaiMaxOutputTokens | quote }}
  OPENAI_MAX_CONCURRENCY: {{ .Values.config.openaiMaxConcurrency | quote }}
  OPENAI_CIRCUIT_FAILURE_THRESHOLD: {{ .Values.config.openaiCircuitFailureThreshold | quote }}
  OPENAI_CIRCUIT_RECOVERY_SECONDS: {{ .Values.config.openaiCircuitRecoverySeconds | quote }}
  OPENAI_EMBEDDING_MODEL: {{ .Values.config.openaiEmbeddingModel | quote }}
  OPENAI_EMBEDDING_DIMENSIONS: {{ .Values.config.openaiEmbeddingDimensions | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
